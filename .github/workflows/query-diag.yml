# Privremeni, rucno pokretan workflow samo za query dijagnostiku (ne dira fx-calls.yml, ne salje na Discord)
name: Query Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run query diagnostic
        env:
          DIAG_BANKS: "Morgan Stanley,UBS"
        run: python query_diag.py
